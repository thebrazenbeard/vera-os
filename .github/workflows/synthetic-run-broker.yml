name: Synthetic run broker

on:
  pull_request:
    paths:
      - 'src/veraos/synthetic_run.py'
      - 'src/veraos/learning_lease.py'
      - 'tests/test_synthetic_run.py'
      - 'docs/08-synthetic-run-broker.md'
      - '.github/workflows/synthetic-run-broker.yml'

permissions:
  contents: read

jobs:
  synthetic-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run synthetic broker tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_synthetic_run.py -v
