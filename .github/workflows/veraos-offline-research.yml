name: VeraOS offline research contracts
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind test run to exact source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check editor-startup safety first
        run: python -m unittest discover -s tests -p test_workspace_startup_safety.py -v
      - name: Verify VirtIO frame boundaries
        run: python -m unittest discover -s tests -p test_virtio_frame_bounds.py -v
      - name: Verify Buildroot wrapper source contract
        run: python -m unittest discover -s tests -p test_resident_builder_wrapper_contract.py -v
      - name: Verify resident dependency source contract
        run: python -m unittest discover -s tests -p test_resident_dependency_contract.py -v
      - name: Verify native builder artifact custody
        run: python -m unittest discover -s tests -p test_native_builder_artifact_safety.py -v
      - name: Verify fresh resident build output custody
        run: python -m unittest discover -s tests -p test_resident_builder_fresh_output.py -v
      - name: Verify Windows Git Buildroot parser line endings
        run: python -m unittest discover -s tests -p test_buildroot_checkout_eol.py -v
      - name: Verify target rootfs required executables
        run: python -m unittest discover -s tests -p test_resident_target_rootfs_preflight.py -v
      - name: Verify QEMU research qualifier contracts
        run: python -m unittest discover -s tests -p test_resident_qemu_qualification.py -v
      - name: Verify versioned pinned Buildroot Kconfig contracts
        run: python -m unittest discover -s tests -p test_resident_pinned_kconfig_unittest.py -v
      - name: Verify VM qualification wrapper and evidence custody
        run: python -m unittest discover -s tests -p test_vm_contract.py -v
      - name: Adversarial VM qualifier custody checks
        run: python -m unittest discover -s tests -p test_vm_qualification_custody_unittest.py -v
      - name: Verify pinned resident staging and symlink ancestry rejection
        run: python -m unittest discover -s tools/vm -p test_resident_source_staging.py -v

  windows-powershell-source:
    runs-on: windows-latest
    steps:
      - name: Check out exact subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) {
            throw "Windows parser job checkout differs from exact source"
          }
      - name: Parse VM qualification wrapper with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/vm/Test-VeraOSVm.ps1"),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
